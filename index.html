<script>
(()=>{
'use strict';
const C=window.__VAULT_CONFIG__; const $=s=>document.querySelector(s);
const lock=$('#lock'), app=$('#app'), pw=$('#pw'), btn=$('#unlock'), msg=$('#msg');
let failures=0, cooldownUntil=0, locked=false, key=null, timer=null;
const b64u=s=>{const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
async function derive(pass){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u(C.salt),iterations:C.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptBlob(id,k){const b64=window.__VAULT_DATA__&&window.__VAULT_DATA__[id];if(!b64)throw Error('vault');const u=b64u(b64),nonce=u.slice(0,12),ct=u.slice(12);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},k,ct));}
async function decryptText(id,k){return new TextDecoder().decode(await decryptBlob(id,k));}
async function getManifest(k){return JSON.parse(await (async()=>{const u=b64u(C.manifest),nonce=u.slice(0,12),ct=u.slice(12);return new TextDecoder().decode(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},k,ct)));})());}
let manifest=null, urls=new Map();
async function secureAsset(name){
  if(!manifest) throw Error('locked');
  if(urls.has(name)) return urls.get(name);
  const f=manifest.files.find(x=>x.logical===name); if(!f) throw Error('missing asset');
  const data=await decryptBlob(f.id,key); const blob=new Blob([data],{type:f.mime}); const u=URL.createObjectURL(blob); urls.set(name,u); return u;
}
window.secureAsset=secureAsset;
async function hydrateAssets(root){
  const nodes=[...root.querySelectorAll('[src],[poster]')];
  for(const el of nodes){
    for(const attr of ['src','poster']){
      const v=el.getAttribute(attr); if(v && v.startsWith('assets/')){const n=v.slice(7); try{el.setAttribute(attr,await secureAsset(n))}catch(e){el.removeAttribute(attr)}}
    }
  }
}
function fail(text){msg.textContent=text;pw.focus()}
async function unlock(){
  try{await window.__VAULT_READY__;}catch(e){fail('Could not load protected files. Please refresh. 🌸');return}
  if(Date.now()<cooldownUntil){fail('Too many attempts. Please wait a little… ⏳');return}
  const pass=pw.value;
  if(!pass){fail('Enter the secret password first. 🌸');return}
  btn.disabled=true; btn.textContent='Unlocking…'; msg.textContent='';
  try{
    const k=await derive(pass);
    // Manifest decryption is the password verification step.
    const m=await getManifest(k); if(!m||!m.files)throw Error('bad password');
    key=k; manifest=m;
    const html=await decryptText(C.core['index.html'],k);
    const css=await decryptText(C.core['style.css'],k);
    const js=await decryptText(C.core['script.js'],k);
    const doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title.textContent;
    app.innerHTML=doc.body.innerHTML;
    const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
    await hydrateAssets(app);
    const sc=document.createElement('script');sc.textContent=js;app.appendChild(sc);
    lock.classList.add('hide');
    pw.value=''; failures=0;
    // Auto-lock after 30 minutes of inactivity/visibility.
    clearTimeout(timer); timer=setTimeout(()=>location.reload(),30*60*1000);
  }catch(e){
    failures++; if(failures>=5){cooldownUntil=Date.now()+30_000;failures=0;fail('Too many incorrect attempts. Try again in 30 seconds. 🔒')} else fail('That password isn’t right. Try again, Sweeto… 🌸');
  }finally{btn.disabled=false;btn.textContent='Unlock our little world ✨'}
}
btn.addEventListener('click',unlock);pw.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
})();
