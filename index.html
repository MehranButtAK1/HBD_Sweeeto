<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#100b10">
<title>A Little Secret 🌸</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b080c;color:#fff}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}.lock{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#32152b 0,#160c16 42%,#08070a 100%)}.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:#e99bc033;filter:blur(45px);animation:pulse 5s ease-in-out infinite}.card{position:relative;width:min(440px,100%);padding:42px 28px 30px;text-align:center;border:1px solid #ffffff1a;border-radius:28px;background:#ffffff0a;backdrop-filter:blur(18px);box-shadow:0 30px 90px #0008}.flower{font-size:48px;animation:float 3s ease-in-out infinite}.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;opacity:.65;margin:18px 0 10px}.title{font-family:Georgia,serif;font-size:38px;line-height:1.05;margin:0}.title em{color:#f0b8d8;font-weight:400}.sub{opacity:.72;line-height:1.7;margin:16px 0 24px}.input{width:100%;padding:15px 17px;border-radius:15px;border:1px solid #ffffff22;background:#0006;color:#fff;outline:0;font-size:16px}.input:focus{border-color:#f0b8d877;box-shadow:0 0 0 4px #f0b8d812}.btn{width:100%;margin-top:12px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#f3b9d9,#c58bb0);color:#190e17;font-weight:800;font-size:15px;cursor:pointer}.msg{min-height:22px;margin:13px 0 0;font-size:13px;color:#f6c4df}.hint{margin-top:22px;font-size:11px;opacity:.42}.hide{display:none!important}@keyframes pulse{50%{transform:scale(1.18);opacity:.7}}@keyframes float{50%{transform:translateY(-7px) rotate(2deg)}}
#app{min-height:100vh}
</style>
</head>
<body>
<div id="lock" class="lock"><div class="glow"></div><div class="card"><div class="flower">🌸</div><div class="eyebrow">a little secret for one special person</div><h1 class="title">For My <em>Sweeto</em> ♡</h1><p class="sub">This little world is protected.<br>Only someone with the secret can open it. 🌻</p><input id="pw" class="input" type="password" autocomplete="off" placeholder="Enter the secret password" aria-label="Secret password"><button id="unlock" class="btn">Unlock our little world ✨</button><div id="msg" class="msg" role="status"></div><div class="hint">Private surprise · 15 · 09 · 2026</div></div></div>
<div id="app"></div>
<script src="vault/config.js"></script>
<script>
(()=>{
'use strict';
const C=window.__VAULT_CONFIG__; const $=s=>document.querySelector(s);
const lock=$('#lock'), app=$('#app'), pw=$('#pw'), btn=$('#unlock'), msg=$('#msg');
let failures=0, cooldownUntil=0, locked=false, key=null, timer=null;
const b64u=s=>{const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
async function derive(pass){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u(C.salt),iterations:C.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptBlob(id,k){const r=await fetch('vault/'+id,{cache:'no-store'});if(!r.ok)throw Error('vault');const ab=await r.arrayBuffer(), u=new Uint8Array(ab), nonce=u.slice(0,12), ct=u.slice(12);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},k,ct));}
async function decryptText(id,k){return new TextDecoder().decode(await decryptBlob(id,k));}
async function getManifest(k){return JSON.parse(await (async()=>{const u=b64u(C.manifest),nonce=u.slice(0,12),ct=u.slice(12);return new TextDecoder().decode(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},k,ct)));})());}
let manifest=null, urls=new Map();
async function secureAsset(name){
  if(!manifest) throw Error('locked');
  if(urls.has(name)) return urls.get(name);
  const f=manifest.files.find(x=>x.logical===name); if(!f) throw Error('missing asset');
  const data=await decryptBlob(f.id,key); const blob=new Blob([data],{type:f.mime}); const u=URL.createObjectURL(blob); urls.set(name,u); return u;
}
window.secureAsset=secureAsset;
async function hydrateAssets(root){
  const nodes=[...root.querySelectorAll('[src],[poster]')];
  for(const el of nodes){
    for(const attr of ['src','poster']){
      const v=el.getAttribute(attr); if(v && v.startsWith('assets/')){const n=v.slice(7); try{el.setAttribute(attr,await secureAsset(n))}catch(e){el.removeAttribute(attr)}}
    }
  }
}
function fail(text){msg.textContent=text;pw.focus()}
async function unlock(){
  if(Date.now()<cooldownUntil){fail('Too many attempts. Please wait a little… ⏳');return}
  const pass=pw.value;
  if(!pass){fail('Enter the secret password first. 🌸');return}
  btn.disabled=true; btn.textContent='Unlocking…'; msg.textContent='';
  try{
    const k=await derive(pass);
    // Manifest decryption is the password verification step.
    const m=await getManifest(k); if(!m||!m.files)throw Error('bad password');
    key=k; manifest=m;
    const html=await decryptText(C.core['index.html'],k);
    const css=await decryptText(C.core['style.css'],k);
    const js=await decryptText(C.core['script.js'],k);
    const doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title.textContent;
    app.innerHTML=doc.body.innerHTML;
    const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
    await hydrateAssets(app);
    const sc=document.createElement('script');sc.textContent=js;app.appendChild(sc);
    lock.classList.add('hide');
    pw.value=''; failures=0;
    // Auto-lock after 30 minutes of inactivity/visibility.
    clearTimeout(timer); timer=setTimeout(()=>location.reload(),30*60*1000);
  }catch(e){
    failures++; if(failures>=5){cooldownUntil=Date.now()+30_000;failures=0;fail('Too many incorrect attempts. Try again in 30 seconds. 🔒')} else fail('That password isn’t right. Try again, Sweeto… 🌸');
  }finally{btn.disabled=false;btn.textContent='Unlock our little world ✨'}
}
btn.addEventListener('click',unlock);pw.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
})();
</script>
</body></html>
